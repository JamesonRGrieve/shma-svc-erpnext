---
erpnext_compose_path: "/opt/containers/erpnext/runtime.compose.yml"
erpnext_compose_owner: "root"
erpnext_compose_group: "root"
erpnext_compose_file_mode: "0640"
# stack|local - determines how container resources are rendered for compose runtimes
erpnext_compose_mode: "stack"

erpnext_project_name: "erpnext"
erpnext_runtime_name: "{{ erpnext_project_name }}"

erpnext_user_uid: 1000
erpnext_user_gid: 1000

erpnext_internal_ports:
  frontend: 8080
  backend: 8000
  socketio: 9000

erpnext_http_port: 8080
erpnext_backend_advertised_ip_override: "{{ lookup('ansible.builtin.env', 'APP_BACKEND_IP') | default(lookup('ansible.builtin.vars', 'APP_BACKEND_IP'), true) }}"
erpnext_backend_advertised_ip: "{{ erpnext_backend_advertised_ip_override | default(erpnext_dependency_exports.edge.backend_ip, true) | default('0.0.0.0', true) }}"

erpnext_wait_for_services_timeout_base: 600
erpnext_wait_for_services_timeout_multiplier: 1.0
erpnext_wait_for_services_timeout: "{{ (erpnext_wait_for_services_timeout_base * erpnext_wait_for_services_timeout_multiplier) | round(0, 'ceil') | int }}"

erpnext_invalid_placeholder_tokens:
  - ""
  - "change-me"
  - "CHANGE-ME"
  - "changeme"
  - "CHANGE_ME"

erpnext_image_repositories:
  frontend: "ghcr.io/frappe/erpnext-nginx"
  backend: "ghcr.io/frappe/erpnext-worker"
  scheduler: "ghcr.io/frappe/erpnext-worker"
  queue: "ghcr.io/frappe/erpnext-worker"
  socketio: "ghcr.io/frappe/frappe-socketio"
  configurator: "ghcr.io/frappe/erpnext-worker"

erpnext_images:
  frontend: "{{ lookup('ansible.builtin.env', 'ERPNEXT_FRONTEND_IMAGE') | default(lookup('ansible.builtin.vars', 'ERPNEXT_FRONTEND_IMAGE'), true) }}"
  backend: "{{ lookup('ansible.builtin.env', 'ERPNEXT_BACKEND_IMAGE') | default(lookup('ansible.builtin.vars', 'ERPNEXT_BACKEND_IMAGE'), true) }}"
  scheduler: "{{ lookup('ansible.builtin.env', 'ERPNEXT_SCHEDULER_IMAGE') | default(lookup('ansible.builtin.vars', 'ERPNEXT_SCHEDULER_IMAGE'), true) | default(erpnext_images.backend, true) }}"
  queue: "{{ lookup('ansible.builtin.env', 'ERPNEXT_QUEUE_IMAGE') | default(lookup('ansible.builtin.vars', 'ERPNEXT_QUEUE_IMAGE'), true) | default(erpnext_images.backend, true) }}"
  socketio: "{{ lookup('ansible.builtin.env', 'ERPNEXT_SOCKETIO_IMAGE') | default(lookup('ansible.builtin.vars', 'ERPNEXT_SOCKETIO_IMAGE'), true) }}"
  configurator: "{{ lookup('ansible.builtin.env', 'ERPNEXT_CONFIGURATOR_IMAGE') | default(lookup('ansible.builtin.vars', 'ERPNEXT_CONFIGURATOR_IMAGE'), true) | default(erpnext_images.backend, true) }}"

erpnext_default_limits:
  reservations:
    cpus: "0.5"
    memory: "512M"
  limits:
    cpus: "2.0"
    memory: "1G"

erpnext_limits:
  frontend: {{ erpnext_default_limits }}
  backend: {{ erpnext_default_limits | combine({'reservations': {'cpus': '1.0', 'memory': '1G'}, 'limits': {'cpus': '3.0', 'memory': '4G'}}, recursive=True) }}
  socketio: {{ erpnext_default_limits | combine({'reservations': {'cpus': '0.25', 'memory': '256M'}, 'limits': {'cpus': '1.0', 'memory': '512M'}}, recursive=True) }}
  scheduler: {{ erpnext_default_limits | combine({'reservations': {'cpus': '0.25', 'memory': '512M'}}, recursive=True) }}
  queue: {{ erpnext_default_limits | combine({'reservations': {'cpus': '0.5', 'memory': '1G'}, 'limits': {'cpus': '2.0', 'memory': '2G'}}, recursive=True) }}
  configurator: {{ erpnext_default_limits | combine({'reservations': {'cpus': '0.25', 'memory': '512M'}}, recursive=True) }}
  upgrade: {{ erpnext_default_limits | combine({'reservations': {'cpus': '0.25', 'memory': '512M'}}, recursive=True) }}

erpnext_networks:
  - name: "svc-overlay"
    external: true
    required: true

erpnext_dependency_exports: "{{ dependency_exports | default({}) }}"
erpnext_database_dependency: "{{ erpnext_dependency_exports.database | default({}) }}"
erpnext_cache_dependency: "{{ erpnext_dependency_exports.cache | default({}) }}"
erpnext_queue_dependency: "{{ erpnext_dependency_exports.queue | default(erpnext_dependency_exports.cache | default({})) }}"

erpnext_database_override_host: "{{ lookup('ansible.builtin.env', 'DATABASE_HOST') | default(lookup('ansible.builtin.vars', 'DATABASE_HOST'), true) }}"
erpnext_database_override_port: "{{ lookup('ansible.builtin.env', 'DATABASE_PORT') | default(lookup('ansible.builtin.vars', 'DATABASE_PORT'), true) }}"
erpnext_database_override_name: "{{ lookup('ansible.builtin.env', 'DATABASE_NAME') | default(lookup('ansible.builtin.vars', 'DATABASE_NAME'), true) }}"
erpnext_database_override_user: "{{ lookup('ansible.builtin.env', 'DATABASE_USER') | default(lookup('ansible.builtin.vars', 'DATABASE_USER'), true) }}"
erpnext_database_override_password: "{{ lookup('ansible.builtin.env', 'DATABASE_PASSWORD') | default(lookup('ansible.builtin.vars', 'DATABASE_PASSWORD'), true) }}"

erpnext_database_required_major_minor: "10.11"

erpnext_cache_override_host: "{{ lookup('ansible.builtin.env', 'CACHE_HOST') | default(lookup('ansible.builtin.vars', 'CACHE_HOST'), true) }}"
erpnext_cache_override_port: "{{ lookup('ansible.builtin.env', 'CACHE_PORT') | default(lookup('ansible.builtin.vars', 'CACHE_PORT'), true) }}"
erpnext_cache_override_password: "{{ lookup('ansible.builtin.env', 'CACHE_PASSWORD') | default(lookup('ansible.builtin.vars', 'CACHE_PASSWORD'), true) }}"

erpnext_queue_override_host: "{{ lookup('ansible.builtin.env', 'QUEUE_HOST') | default(lookup('ansible.builtin.vars', 'QUEUE_HOST'), true) }}"
erpnext_queue_override_port: "{{ lookup('ansible.builtin.env', 'QUEUE_PORT') | default(lookup('ansible.builtin.vars', 'QUEUE_PORT'), true) }}"
erpnext_queue_override_password: "{{ lookup('ansible.builtin.env', 'QUEUE_PASSWORD') | default(lookup('ansible.builtin.vars', 'QUEUE_PASSWORD'), true) }}"

erpnext_database_default_name: "erpnext"
erpnext_database_default_user: "erpnext"
erpnext_database_default_version: "10.11.0"
erpnext_database_default_ssl_mode: "REQUIRED"

erpnext_cache_default_db: 1

erpnext_queue_default_db: 2

erpnext_site_name: "erpnext.local"
erpnext_site_admin_user: "Administrator"
erpnext_site_admin_password: null

erpnext_socketio_extra_env: {}

erpnext_extra_env: {}

erpnext_require_proxy: true
erpnext_proxy_configured: false

erpnext_validate_redis_connections: true

erpnext_runtime_volumes_requested:
  - "{{ erpnext_volumes.sites }}"
  - "{{ erpnext_volumes.assets }}"

erpnext_volumes:
  sites: "erpnext-sites"
  assets: "erpnext-assets"

erpnext_mounts:
  persistent:
    - source: "{{ erpnext_volumes.sites }}"
      target: "/home/frappe/frappe-bench/sites"
    - source: "{{ erpnext_volumes.assets }}"
      target: "/home/frappe/frappe-bench/sites/assets"
  ephemeral_mounts:
    - target: "/tmp"
      options: "rw,nosuid,nodev,noexec,size=64m"
    - target: "/home/frappe/frappe-bench/logs"
      options: "rw,nosuid,nodev,noexec,size=256m"
    - target: "/home/frappe/frappe-bench/sites/assets/node_modules"
      options: "rw,nosuid,nodev,noexec,size=256m"
    - target: "/home/frappe/frappe-bench/sites/assets/.cache"
      options: "rw,nosuid,nodev,noexec,size=256m"
    - target: "/var/run"
      options: "rw,nosuid,nodev,noexec,size=32m"

erpnext_app_fqdn: "{{ lookup('ansible.builtin.env', 'APP_FQDN') | default(lookup('ansible.builtin.vars', 'APP_FQDN'), true) | default(erpnext_site_name, true) }}"

erpnext_runtime_exports:
  env:
    APP_FQDN: "{{ erpnext_app_fqdn }}"
    APP_PORT: "{{ erpnext_http_port }}"
    APP_BACKEND_IP: "{{ erpnext_backend_advertised_ip }}"

erpnext_runtime_environment_base:
  DB_NAME: "{{ erpnext_database_default_name }}"
  DB_USER: "{{ erpnext_database_default_user }}"
  DB_SSL_MODE: "{{ erpnext_database_default_ssl_mode }}"
  MARIADB_VERSION: "{{ erpnext_database_default_version }}"
  FRAPPE_SITE_NAME_HEADER: "{{ erpnext_site_name }}"
  SITE_NAME: "{{ erpnext_site_name }}"
  SITE_ADMIN: "{{ erpnext_site_admin_user }}"

erpnext_runtime_secret_env_keys:
  - DB_PASSWORD
  - SITE_PASSWORD
  - REDIS_QUEUE
  - REDIS_QUEUE_FOR_EVENTS
  - REDIS_CACHE
  - SOCKETIO_REDIS_URL
  - REDIS_URL

erpnext_runtime_services_blueprint:
  erpnext-frontend:
    image_key: frontend
    command:
      - nginx
    environment:
      config:
        SOCKETIO_PORT: "{{ erpnext_internal_ports.socketio }}"
      inherit_secrets:
        - DB_PASSWORD
        - SITE_PASSWORD
        - REDIS_QUEUE
        - REDIS_QUEUE_FOR_EVENTS
        - REDIS_CACHE
    ports:
      - published: "{{ erpnext_http_port }}"
        target: "{{ erpnext_internal_ports.frontend }}"
        protocol: tcp
    depends_on:
      erpnext-backend:
        condition: service_healthy
      erpnext-socketio:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:{{ erpnext_internal_ports.frontend }}/api/method/ping || exit 1"
      interval: "30s"
      timeout: "5s"
      retries: 5
      start_period: "60s"
    limits_key: frontend
  erpnext-backend:
    image_key: backend
    command:
      - bench
      - serve
      - --port
      - "{{ erpnext_internal_ports.backend }}"
    environment:
      config: {}
      inherit_secrets:
        - DB_PASSWORD
        - SITE_PASSWORD
        - REDIS_QUEUE
        - REDIS_QUEUE_FOR_EVENTS
        - REDIS_CACHE
        - SOCKETIO_REDIS_URL
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:{{ erpnext_internal_ports.backend }}/api/method/ping || exit 1"
      interval: "30s"
      timeout: "5s"
      retries: 5
      start_period: "60s"
    limits_key: backend
  erpnext-socketio:
    image_key: socketio
    command:
      - npm
      - start
    environment:
      config: {}
      inherit_secrets:
        - DB_PASSWORD
        - SITE_PASSWORD
        - REDIS_QUEUE
        - REDIS_QUEUE_FOR_EVENTS
        - REDIS_CACHE
        - SOCKETIO_REDIS_URL
        - REDIS_URL
    expose:
      - "{{ erpnext_internal_ports.socketio }}"
    limits_key: socketio
  erpnext-scheduler:
    image_key: scheduler
    command:
      - bench
      - schedule
    restart: on-failure
    environment:
      config: {}
      inherit_secrets:
        - DB_PASSWORD
        - SITE_PASSWORD
        - REDIS_QUEUE
        - REDIS_QUEUE_FOR_EVENTS
        - REDIS_CACHE
        - SOCKETIO_REDIS_URL
    limits_key: scheduler
  erpnext-queue:
    image_key: queue
    command:
      - bench
      - worker
      - --queue
      - default,short,long
    restart: on-failure
    environment:
      config: {}
      inherit_secrets:
        - DB_PASSWORD
        - SITE_PASSWORD
        - REDIS_QUEUE
        - REDIS_QUEUE_FOR_EVENTS
        - REDIS_CACHE
        - SOCKETIO_REDIS_URL
    limits_key: queue
  erpnext-site-creator:
    image_key: configurator
    profiles:
      - setup
    command:
      - /bin/bash
      - -ec
      - |
          /usr/local/bin/wait-for-it {{ erpnext_database.host | default('') }}:{{ erpnext_database.port | default('') }} -t {{ erpnext_wait_for_services_timeout }}
          /usr/local/bin/wait-for-it {{ erpnext_cache.host | default('') }}:{{ erpnext_cache.port | default('') }} -t {{ erpnext_wait_for_services_timeout }}
          if [ ! -d "/home/frappe/frappe-bench/sites/{{ erpnext_site_name }}" ]; then
            bench new-site {{ erpnext_site_name }} \
              --no-mariadb-socket \
              --admin-password "${SITE_PASSWORD}" \
              --db-name "{{ erpnext_database.name }}" \
              --db-password "${DB_PASSWORD}" \
              --install-app {{ erpnext_configurator_install_apps | join(' ') }};
          fi
    restart: "no"
    environment:
      config: {}
      inherit_secrets:
        - DB_PASSWORD
        - SITE_PASSWORD
        - REDIS_QUEUE
        - REDIS_QUEUE_FOR_EVENTS
        - REDIS_CACHE
        - SOCKETIO_REDIS_URL
    limits_key: configurator
  erpnext-upgrade:
    image_key: backend
    profiles:
      - ops
    command: {{ erpnext_upgrade_command }}
    restart: "no"
    environment:
      config: {}
      inherit_secrets:
        - DB_PASSWORD
        - SITE_PASSWORD
        - REDIS_QUEUE
        - REDIS_QUEUE_FOR_EVENTS
        - REDIS_CACHE
        - SOCKETIO_REDIS_URL
    limits_key: upgrade

erpnext_runtime_common_container_settings:
  user: "{{ erpnext_user_uid }}:{{ erpnext_user_gid }}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 1m

erpnext_create_site: true
erpnext_enable_upgrade_helper: true

erpnext_upgrade_command:
  - bench
  - migrate

erpnext_configurator_install_apps:
  - erpnext

erpnext_service_contract_runtime: erpnext

